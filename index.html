<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dosimeter History</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f4f6f8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #eeeeee;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Dosimeter History</h1>
    <div id="drValue">DR: --</div>
    <div id="status">Loading...</div>

    <table>
        <thead>
            <tr>
                <th>No.</th>
                <th>Date</th>
                <th>Dose</th>
            </tr>
        </thead>

        <tbody id="historyTable">
        </tbody>
    </table>

</div>

<script>
const cpsURL =
"https://dgrdatabase-27277-default-rtdb.asia-southeast1.firebasedatabase.app/cps.json";

fetch(cpsURL)
.then(response => response.json())
.then(cps => {
document.getElementById("drValue").innerText =
    "DR: " + cps;
})
.catch(error => {
    document.getElementById("cpsValue").innerText =
        "CPS: Error";
});
const firebaseURL =
"https://dgrdatabase-27277-default-rtdb.asia-southeast1.firebasedatabase.app/devices/DEVICE001/history.json";

fetch(firebaseURL)
.then(response => response.json())
.then(data => {

    const table = document.getElementById("historyTable");
    const status = document.getElementById("status");

    if (!data) {
        status.innerText = "No data found";
        return;
    }

    const records = Array.isArray(data) ? data : Object.values(data);

    records.forEach((record, index) => {

        const parts = record.trim().split(/\s+/);

        const number = index + 1;

        const date = parts[1] || "";
        const dose = parts[2] || "";

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${number}</td>
            <td>${date}</td>
            <td>${dose}</td>
        `;

        table.appendChild(row);
    });

    status.innerText = records.length + " records loaded";

})
.catch(error => {

    document.getElementById("status").innerText =
        "Error loading data";

    console.error(error);

});

</script>

</body>
</html>
